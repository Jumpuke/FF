<script>
  const squares = [
    "Propeller Kid",
    "Speech Impediment",
    "Star Wars Lightsaber",
    "Someone Random Has a FaceTime Convo with Micah",
    "That One Fat Kid",
    "Jacob’s Man Looking Ex",
    "Someone Over 40",
    "Make a Fake Finleigh Story That Lasts 5+ Minutes",
    "Tell 2 random girls andy likes them",
    "Convince Someone Finleigh Is Here",
    "Make someone random get a picture with Andy
    "“No Hands” Gets Played",
    "Make a Joke No One Laughs At to 5+ People",
    "Andy Has to Deal with a Drunk",
    "Dance Floor Has Fewer Than 1 Girl",
    "Someone Wearing Cargo Shorts",
    "Someone Brings Up Elon Musk",
    "Capture Andy's 1s",
    "Chase Reference",
    "Tell 5+ people about you walking in on andy buttass naked",
    "Doing to much kid",
    "Someone Brings Up Abdul",
    "Tell someone that they look like they chew on bricks",
    "Make a Fake Story with Quigley That Lasts 5 Minutes",
    "5+ Drinks Before 12"
  ];

  const board = document.getElementById("board");
  const status = document.getElementById("status");
  const reset = document.getElementById("reset");

  let checkedSquares = JSON.parse(
    localStorage.getItem("finleighFridaySquares") || "[]"
  );

  function saveBoard() {
    localStorage.setItem(
      "finleighFridaySquares",
      JSON.stringify(checkedSquares)
    );
  }

  function updateStatus() {
    status.textContent =
      `${checkedSquares.length} of ${squares.length} squares checked.`;
  }

  squares.forEach((text, index) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "square";

    const check = document.createElement("div");
    check.className = "check";
    check.textContent = "✓";

    const label = document.createElement("div");
    label.textContent = text;

    btn.append(check, label);

    // IMPORTANT: restore saved state on page load
    if (checkedSquares.includes(index)) {
      btn.classList.add("checked");
      btn.setAttribute("aria-pressed", "true");
    } else {
      btn.setAttribute("aria-pressed", "false");
    }

    btn.addEventListener("click", () => {
      const isChecked = btn.classList.toggle("checked");

      if (isChecked) {
        if (!checkedSquares.includes(index)) {
          checkedSquares.push(index);
        }
      } else {
        checkedSquares = checkedSquares.filter(i => i !== index);
      }

      btn.setAttribute("aria-pressed", isChecked ? "true" : "false");

      saveBoard();
      updateStatus();
    });

    board.appendChild(btn);
  });

  reset.addEventListener("click", () => {
    checkedSquares = [];

    document.querySelectorAll(".square").forEach(btn => {
      btn.classList.remove("checked");
      btn.setAttribute("aria-pressed", "false");
    });

    saveBoard();
    updateStatus();
  });

  updateStatus();
</script>
